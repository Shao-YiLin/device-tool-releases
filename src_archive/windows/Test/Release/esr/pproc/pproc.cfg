;#################################################################
;#	本配置文件区分大小写，所有属性/配置名一律采用小写字符		#
;#				后处理处理模块配置【postproc】					#
;#################################################################
[postproc]
;是否关闭数字规整，替换处理，标点处理,顺滑和简转繁【true/false】
pproc_param_closeallproc=false

;是否进行顺滑处理【true/false】
usesmooth=true

;是否进行口语规整处理【true/false】
colloqproc=false

;是否进行标点处理【true/false】
puncproc=true

;是否进行数字规整【true/false】
numproc=true

;是否进行替换处理【true/false】
use_replace=true

;是否进行分段处理【true/false】
paragraproc = false

;接口类型【0 - 转写，1 - 听写】
interfacetype = 1

;标点输出是否为缓存模式，缓存模式时标点随下一次输出【true/false】【听写独有配置，转写时此配置失效】
puncCacheMoudle = true

;处理语言【0 - 中文，1 - 粤语，2 - 英语】
languagetype=

;Quark输出类型默认为CnNet
;nextG输出类型【0 - JSON格式, 1 - 常规(文本格式)】
outputtype=0

;是否将简体转化为繁体(只在普通话和粤语语种时有效)【true/false】,默认为false
needJianToFan=false

;是否关闭后处理的置信度输出【true/false】,默认为false
outCmInfo=false

;#是否根据词属性优化顺滑和标点【true/false】【传入的词带有属性时开启才有效】
useAttribute=false

;#是否保留除n、s、p、g外的其它词属性【true/false】，默认为false
reserveAllAttribute=false
;维语替换词资源路径
uighur_res_path = pproc/ReplaceWordMapList.txt
;语义顺滑资源路径
smooth_path = pproc/SmoothList.txt
;替换列表路径
replace_res_path = pproc/replace_list.txt
;标点配置
use_punc = false
#标点计算类型，0：浮点，1：定点
punc_calc_type = 1
punc_res_path = pproc/newpunc_ch_en_with_vad.bin
punc_dict	= pproc/danzi_mix_ch_en.dict
punc_class = pproc/target_class.txt
punc_prior = 0.85924767,0.062097898,0.068435067,0.000801522,0.009417843
punc_prior_rate = 0.2
punc_cache_moudle = true
vad_punc_threshold = 0
period_punc_threshold = 0
print_punc_rlt =


;#################################################################
;#						数字处理配置【numproc】					#
;#################################################################
[postproc\numproc]
;nlp模块dll路径
nlp_module_path= nlp.dll

;数字规整使用c++:0 还是 python:1
num_proc_type = 0
;数字规整场景，0:普通场景，1:教育场景，2:医疗场景
num_usage_scene = 0
;nlp相关资源
semantic_word_dict=pproc/resource_2_0_12/SemanticWord.dic
basic_phrase_gram=pproc/resource_2_0_12/BasicPhrase.gram
number_dict=pproc/resource_2_0_12/number_math_normal.dic
number_gram=pproc/resource_2_0_12/number_math_normal.gram
not_replace_list=pproc/resource_2_0_12/num_not_change_list


;#需要处理的数字语义
[postproc\numproc\proc_num_semantic]
;语义=on/off
NumStr=on
NumSeq=on
BigNum=on
PersonalInformation=on
Date=on
Time=on
Fraction=on
LicensePlate=on
NumberOverWan=on
Delete=on
MathSymbol=on
SpecialWord=on
WebSite=on
NumstrUighur=on
NumseqUighur=on
MonthUighur=on
NumsymbolUighur=on
NumzeroUighur=on
SpecialwordUighur=on
SpecialnullUighur=on
SpecialpointUighur=on
CourtMeasure=on

;#需要输出的数字语义
[postproc\numproc\output_num_semantic]
;语义=on/off


;#################################################################
;#						标点处理配置【puncproc】				#
;#################################################################
[postproc\puncproc]
;punc blstm计算类型0-float，1-8bit，2-16bit，默认0
punc_calc_type = 1
;new punc model
blstm_BinURL_punc = pproc/20180319_punc_local_srf_lrate0.5_pfile1_iter0_punc.bin
blstm_BinURL_punc_PD = pproc/20180507_punc_local_eng_lrate0.5_pfile1_iter0_punc.bin

;标点先验系数，默认为0.0
prior_rate = 0.3
;中英文五类标点先验值
prior_value = 0.847,0.082,0.035,0.012,0.024
prior_value_en = 0.87,0.069,0.055,0.0002,0.0055

;Vad间标点门限，当预测结果为不给标点时(max为0)，此门限生效，
;此门限用于设定max和second_max之间的差值，差值大于此门限才不加标点，否则加second_max标点
;默认为0，代表此门限失效(Quark网站和会议系统都设为0，输入法时设为0.9)
vad_punc_threshold = 0.9

;句中句号门限，用于限制句中出句号，
;当句中句号得分-逗号得分，大于此门限时才加句号，否则加逗号
;默认为0，代表此门限失效(Quark网站和会议系统都设为0，输入法时设为7)
period_punc_threshold =

;打印标点预测结果，默认为0
print_punc_result = 0


[logger]
file                  =    ../log/postproc.log
level                 =   
output                =   
flush                 = 
maxsize               = 
overwrite             = 
